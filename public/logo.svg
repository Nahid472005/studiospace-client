<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square with Golden Border -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#amberGrad)" stroke-width="6" />
  
  <!-- Spotlight Glow -->
  <circle cx="60" cy="60" r="38" fill="#f59e0b" opacity="0.15" />
  
  <!-- Camera Shutter Blades -->
  <g stroke="url(#amberGrad)" stroke-width="4.5" stroke-linecap="round" fill="none">
    <circle cx="60" cy="60" r="42" opacity="0.3" />
    <path d="M71.5 40 L100.2 89.7" />
    <path d="M48.5 40 H105.8" />
    <path d="M37 60 L65.7 10.3" />
    <path d="M48.5 80 L19.8 30.3" />
    <path d="M71.5 80 H14.2" />
    <path d="M83 60 L54.3 109.7" />
  </g>
  
  <!-- Core Aperture Center -->
  <circle cx="60" cy="60" r="11" fill="url(#amberGrad)" />
  <circle cx="60" cy="60" r="5" fill="#0f172a" />
</svg>
